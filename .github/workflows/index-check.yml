name: Index check

# Index large real repositories every night, and fail on any error.
# Parser edge cases in big codebases have failed whole indexes in
# production. This finds them first.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      repositories:
        description: "owner/name@branch, comma separated. Empty: the default list"
        required: false
        default: ""

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: Index real repositories

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app guard $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app guard
        env:
          CI: 'Yes'

      - name: Index
        working-directory: /home/runner/frappe-bench
        run: |
          METHOD=guard.indexing.check.index_repositories
          if [ -n "$REPOSITORIES" ]; then
            ARGS="{\"repositories\": \"$REPOSITORIES\"}"
            bench --site test_site execute "$METHOD" --kwargs "$ARGS"
          else
            bench --site test_site execute "$METHOD"
          fi
        env:
          REPOSITORIES: ${{ inputs.repositories }}
