name: Evals

# Replay recorded pull requests through a full review when the review
# prompts, rules or checks change. Needs an AI gateway: without the
# GUARD_EVAL_* secrets, the run skips. Set the repository variable
# EVAL_MIN_RECALL (0 to 1) to fail on low recall. A manual run can pick
# the model, to compare models on the same cases.
on:
  pull_request:
    paths:
      - "guard/review/**"
      - "guard/llm/**"
      - "guard/evals/**"
      - "guard/config/**"
  workflow_dispatch:
    inputs:
      model:
        description: "Model for every tier. Empty: the GUARD_EVAL_MODEL secret."
        required: false
        default: ""

concurrency:
  group: evals-${{ github.event.number || github.ref }}-${{ inputs.model }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Replay review cases

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app guard $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app guard
        env:
          CI: 'Yes'

      - name: Run evals
        working-directory: /home/runner/frappe-bench
        shell: bash
        run: |
          set +e
          bench --site test_site execute guard.evals.run.ci | tee evals.log
          status=${PIPESTATUS[0]}
          set -e
          # The summary also helps when the run fails, so write it first.
          sed -n '/<!-- guard-evals -->/,/<!-- \/guard-evals -->/p' evals.log \
            >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          GUARD_EVAL_GATEWAY_URL: ${{ secrets.GUARD_EVAL_GATEWAY_URL }}
          GUARD_EVAL_GATEWAY_KEY: ${{ secrets.GUARD_EVAL_GATEWAY_KEY }}
          GUARD_EVAL_MODEL: ${{ inputs.model || secrets.GUARD_EVAL_MODEL }}
          GUARD_EVAL_DIALECT: ${{ vars.GUARD_EVAL_DIALECT }}
          EVAL_MIN_RECALL: ${{ vars.EVAL_MIN_RECALL }}
